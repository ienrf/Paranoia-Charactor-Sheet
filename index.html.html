<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>パラノイア キャラクターシート出力ツール</title>
<style>
  /* サイトの見た目を整えるデザイン（CSS） */
  body { font-family: sans-serif; background-color: #333; color: #333; padding: 20px;}
  .container { background-color: #fff; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-top: 5px solid #000; }
  h1 { text-align: center; color: #000; font-size: 24px; border-bottom: 2px solid #ccc; padding-bottom: 10px;}
  h3 { margin-top: 15px; margin-bottom: 10px; font-size: 15px; border-left: 4px solid #000; padding-left: 8px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;}
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  .flex-row { display: flex; gap: 10px; }
  .box-name { flex: 1; }           /* 名前：残りのスペースを全部使う */
  .box-clear { width: 70px; }     /* クリアランス：文字が収まる幅に固定 */
  .box-sector { width: 60px; }     /* セクター：短めに固定 */
  .box-clone { width: 50px; }      /* クローン：短めに固定 */
  .box-clear label, .box-sector label, .box-clone label {
    font-size: 11px; /* 元は14px。数字を小さくするとさらに小さくなります */
  }
  .btn { display: block; width: 100%; padding: 15px; background-color: #000; color: #fff; text-align: center; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; transition: 0.3s; }
  .btn:hover { background-color: #444; }
  .note { font-size: 12px; color: #666; margin-top: 5px; }

/* サービスグループ説明用インフォアイコン */
  .info-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background-color: #eee;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-weight: bold;
    cursor: help;
    font-size: 14px;
    color: #555;
    user-select: none;
    flex-shrink: 0;
  }
  .info-icon:hover {
    background-color: #ddd;
    color: #000;
  }

  /* 技能セクションと総合計値のスタイル */
  .skills-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 25px;
    margin-bottom: 15px;
    border-bottom: 1px solid #eee;
    padding-bottom: 5px;
  }
  .skills-header h2 { margin: 0; font-size: 14px; }
  .total-display { font-weight: bold; font-size: 14px; color: #333; }
  
/* 右側にまとめる操作用エリア */
  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
  }

  /* 41以上で赤く表示するためのクラス */
  .over-limit {
    color: #e53935;
    font-weight: bold;  
  }

  .dice-btn {
    width: auto;
    padding: 6px 10px;
    background-color: #75e275;
    color: white;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
  }
  .dice-btn:hover { background-color: #72bd72; }

.dice-btn-blue {
    background-color: #1e88e5;
  }
  .dice-btn-blue:hover { background-color: #1565c0; }


/*主要技能と分野技能の枠組みスタイル */
  .skill-block {
    background-color: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .skill-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: bold;
    font-size: 14px;
  }
  .input-small {
    width: 50px !important; /* ボックスの横幅を小さく固定 */
    text-align: center;
  }
  .specialty-container {
    margin-top: 8px;
    padding-left: 12px;
    border-left: 2px solid #ccc; /* 親技能の配下であることが分かる縦線 */
  }
  .specialty-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .specialty-item input[type="text"],
  .specialty-item select {
    flex: 1;
    padding: 6px;
border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
  }

/* 矢印ボタンのスタイル */
  .arrow-btn {
    background-color: #eee;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    color: #333;
    transition: all 0.2s;
    min-width: 28px;
    text-align: center;
  }
  .arrow-btn:hover { background-color: #ddd; }
  
  /* 状態ごとの色変化（上向き: 緑 / 下向き: 赤） */
  .arrow-btn[data-state="1"] { color: #2e7d32; background-color: #e8f5e9; border-color: #a5d6a7; }
  .arrow-btn[data-state="2"] { color: #1565c0; background-color: #e3f2fd; border-color: #90caf9; }
  .arrow-btn[data-state="3"] { color: #c62828; background-color: #ffebee; border-color: #ef9a9a; }
  

/* 秘密情報領域（2ページ目）のスタイル */
  .container-secret {
    margin-top: 30px;
    border-top: 5px solid #333;
  }
  .secret-warning {
    background-color: #ffebee;
    border: 1px solid #ffcdd2;
    color: #c62828;
    padding: 10px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 13px;
    text-align: center;
    margin-bottom: 20px;
  }



</style>
</head>

/* ダイスで技能値を決定する関数（1d20 / 2、端数切り捨て、最低4） */
  function rollDiceSkills(type) {
    const skillIds = ['management', 'stealth', 'violence', 'hardware', 'software', 'wetware'];
let values = [];
    let sum = 0;

    // 1. タイプ別にダイスを振る
    for (let i = 0; i < 6; i++) {
        const d20 = Math.floor(Math.random() * 20) + 1;
        let val = Math.floor(d20 / 2);
        if (val < 4) val = 4;

      values.push(val);
      sum += val;
    }

    // 2. 合計が40を超えている間、ランダムに1ずつ削る
      while (sum > 40) {
      let randomIndex = Math.floor(Math.random() * 6);
      if (values[randomIndex] > 4) {
        values[randomIndex]--;
        sum--;
      }
    }

    // 3. 画面の入力欄にセットする
    skillIds.forEach((id, index) => {
      const el = document.getElementById(id);
      if (el) el.value = values[index];
    });

    calcTotals(); // 再計算を実行
    updateAllSpecialtyValues(); // 分野技能の一括更新を実行
  }

// 数値が入力されるたびに全6技能の総合計を計算して表示を変えるプログラム
function calcTotals() {
  const m = Number(document.getElementById('management').value) || 0;
  const s = Number(document.getElementById('stealth').value) || 0;
  const v = Number(document.getElementById('violence').value) || 0;
  const h = Number(document.getElementById('hardware').value) || 0;
  const sw = Number(document.getElementById('software').value) || 0;
  const w = Number(document.getElementById('wetware').value) || 0;

  // 6つの合計を算出
  const totalSum = m + s + v + h + sw + w;
  
  const totalSpan = document.getElementById('grandTotal');
  totalSpan.textContent = `${totalSum}/40`;
  
  // 41以上の場合は赤く表示（over-limitクラスを適用）
  if (totalSum >= 41) {
    totalSpan.classList.add('over-limit');
  } else {
    totalSpan.classList.remove('over-limit');
  }
}

      skills.forEach(skill => {

/* 矢印ボタンのクリック処理 */
  function toggleArrow(btn) {
    let state = Number(btn.getAttribute('data-state')) || 0;
    state = (state + 1) % 4;
    btn.setAttribute('data-state', state);

    if (state === 0) {
      btn.textContent = '-';
    } else if (state === 1) {
      btn.textContent = '↑';
    } else if (state === 2) {
      btn.textContent = '⇈';
    } else if (state === 3) {
      btn.textContent = '↓';
    }

    updateAllSpecialtyValues();
  }

  /* 親技能の値と矢印の状態に合わせて全分野技能の値を一括更新する関数 */
  function updateAllSpecialtyValues() {
    for (const [containerId, skills] of Object.entries(specialtyData)) {
      // 例: 'spec-management' から 'management' のIDを取得
      const mainSkillId = containerId.replace('spec-', '');
      const mainEl = document.getElementById(mainSkillId);
      const mainVal = mainEl ? Number(mainEl.value) || 0 : 0;
      
      const container = document.getElementById(containerId);
      if (!container) continue;

      const items = container.querySelectorAll('.specialty-item');
      items.forEach(item => {
        const btn = item.querySelector('.arrow-btn');
        const valInput = item.querySelector('.spec-val');
        if (!btn || !valInput) return;

        const state = Number(btn.getAttribute('data-state')) || 0;
        let finalVal = mainVal; // 基本は親技能と同じ値

        if (state === 1) {
          finalVal = mainVal + 4; // ▲ 上向き: 親技能 + 4
        } else if (state === 2) {
          finalVal = mainVal + 8; // △: 親技能 + 8
        } else if (state === 3) {
          finalVal = 1;          // ▼ 下向き: 親技能の値に関わらず「1」に固定
        }

        valInput.value = finalVal;
      });
    }
  }

function initSecretSkills() {
  const categories = [
    { id: 'secretSkill_unusual', list: secretSkillsData.unusual },
    { id: 'secretSkill_unnecessary', list: secretSkillsData.unnecessary },
    { id: 'secretSkill_unhealthy', list: secretSkillsData.unhealthy }
  ];

  categories.forEach(cat => {
    const select = document.getElementById(cat.id);
    if (!select) return;
    
    select.innerHTML = '<option value="">▼ 分野技能を選択</option>';
    cat.list.forEach(skill => {
      const opt = document.createElement('option');
      opt.value = skill;
      opt.textContent = skill;
      select.appendChild(opt);
    });
  });

  updateSecretSkillHighlights();
}

/* 選択中の秘密結社に合わせておすすめ技能の色・文字を変更 */
function updateSecretSkillHighlights() {
  const societySelect = document.getElementById('secretSociety');
  const currentSociety = societySelect ? societySelect.value : '';
  const mandatoryList = secretSocietyMandatory[currentSociety] || [];
  const recommendedList = secretSocietyRecommendations[currentSociety] || [];

  const selectIds = ['secretSkill_unusual', 'secretSkill_unnecessary', 'secretSkill_unhealthy'];

  selectIds.forEach(id => {
    const select = document.getElementById(id);
    if (!select) return;

    Array.from(select.options).forEach(opt => {
      if (!opt.value) return;

      const isMandatory = mandatoryList.includes(opt.value);
      const isRecommended = recommendedList.includes(opt.value);
      if (isMandatory) {
        opt.textContent = `★ ${opt.value} (強制)`;
        opt.style.color = '#c62828';
        opt.style.fontWeight = 'bold';
        opt.style.backgroundColor = '#ffebee';
      } else
      if (isRecommended) {
        opt.textContent = `★ ${opt.value} (推奨)`;
        opt.style.color = 'green';
        opt.style.fontWeight = 'bold';
        opt.style.backgroundColor = '#c7f4c2';
      } else {
        opt.textContent = opt.value;
        opt.style.color = '';
        opt.style.fontWeight = '';
        opt.style.backgroundColor = '';
      }
    });
  });
}
